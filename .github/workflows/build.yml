name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 ships the Android SDK preinstalled at $ANDROID_HOME.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: carens-dashboard-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk carens-dashboard-debug.apk
          gh release create "$TAG" carens-dashboard-debug.apk \
            --title "Debug build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. Install on the phone; allow installs from this source when prompted." \
            --latest

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
